<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Todo List</h1>
            <p class="text-gray-600">Get things done, one task at a time</p>
        </div>
        
        <!-- Add Todo Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <form id="todo-form" class="flex gap-2">
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="Add a new task..." 
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
                <button 
                    type="submit" 
                    class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition duration-200"
                >
                    Add
                </button>
            </form>
        </div>
        
        <!-- Todo List -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <!-- Todo List Header -->
            <div class="bg-gray-50 px-6 py-3 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-medium text-gray-700">Tasks</h2>
                <span id="todo-count" class="text-sm text-gray-500">0 items</span>
            </div>
            
            <!-- Todo Items -->
            <ul id="todo-list" class="divide-y divide-gray-200">
                <!-- Todos will be added here dynamically -->
            </ul>
            
            <!-- Todo List Footer -->
            <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 flex justify-between text-sm text-gray-500">
                <button id="all-filter" class="text-blue-500 font-medium">All</button>
                <button id="active-filter">Active</button>
                <button id="completed-filter">Completed</button>
                <button id="clear-completed">Clear completed</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const todoForm = document.getElementById('todo-form');
            const todoInput = document.getElementById('todo-input');
            const todoList = document.getElementById('todo-list');
            const todoCount = document.getElementById('todo-count');
            const clearCompletedBtn = document.getElementById('clear-completed');
            
            let todos = [];
            
            // Load todos from localStorage
            if (localStorage.getItem('todos')) {
                todos = JSON.parse(localStorage.getItem('todos'));
                renderTodos();
            }
            
            // Form submission
            todoForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const text = todoInput.value.trim();
                
                if (text) {
                    addTodo(text);
                    todoInput.value = '';
                    todoInput.focus();
                }
            });
            
            // Add new todo
            function addTodo(text) {
                const newTodo = {
                    id: Date.now(),
                    text,
                    completed: false
                };
                
                todos.push(newTodo);
                saveTodos();
                renderTodos();
            }
            
            // Render all todos
            function renderTodos(filter = 'all') {
                const filteredTodos = todos.filter(todo => {
                    if (filter === 'active') return !todo.completed;
                    if (filter === 'completed') return todo.completed;
                    return true;
                });
                
                if (filteredTodos.length === 0) {
                    todoList.innerHTML = '<li class="px-6 py-4 text-center text-gray-500">No tasks found</li>';
                } else {
                    todoList.innerHTML = filteredTodos.map(todo => `
                        <li data-id="${todo.id}" class="px-6 py-4 flex items-center group">
                            <input 
                                type="checkbox" 
                                ${todo.completed ? 'checked' : ''}
                                class="h-5 w-5 text-blue-500 rounded focus:ring-blue-400 mr-3 toggle-todo"
                            >
                            <span class="flex-1 ${todo.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${todo.text}</span>
                            <button 
                                class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition duration-200 delete-todo"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </li>
                    `).join('');
                }
                
                updateCount();
            }
            
            // Toggle todo completion
            todoList.addEventListener('change', function(e) {
                if (e.target.classList.contains('toggle-todo')) {
                    const li = e.target.closest('li');
                    const id = parseInt(li.dataset.id);
                    
                    todos = todos.map(todo => 
                        todo.id === id ? {...todo, completed: !todo.completed} : todo
                    );
                    
                    saveTodos();
                    renderTodos();
                }
            });
            
            // Delete todo
            todoList.addEventListener('click', function(e) {
                if (e.target.classList.contains('delete-todo') || e.target.closest('.delete-todo')) {
                    const li = e.target.closest('li');
                    const id = parseInt(li.dataset.id);
                    
                    todos = todos.filter(todo => todo.id !== id);
                    saveTodos();
                    renderTodos();
                }
            });
            
            // Clear completed todos
            clearCompletedBtn.addEventListener('click', function() {
                todos = todos.filter(todo => !todo.completed);
                saveTodos();
                renderTodos();
            });
            
            // Filter buttons
            document.getElementById('all-filter').addEventListener('click', () => renderTodos('all'));
            document.getElementById('active-filter').addEventListener('click', () => renderTodos('active'));
            document.getElementById('completed-filter').addEventListener('click', () => renderTodos('completed'));
            
            // Update todo count
            function updateCount() {
                const activeCount = todos.filter(todo => !todo.completed).length;
                const totalCount = todos.length;
                todoCount.textContent = `${activeCount} ${activeCount === 1 ? 'item' : 'items'} left (${totalCount} total)`;
            }
            
            // Save todos to localStorage
            function saveTodos() {
                localStorage.setItem('todos', JSON.stringify(todos));
            }
        });
    </script>
</body>
</html>
